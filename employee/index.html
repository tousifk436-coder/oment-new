<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WorkSpace</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/responsive.css">
<link rel="stylesheet" href="css/polish.css">
</head>
<body>

<div id="toast-w"></div>

<!-- DIALOG -->
<div id="dlg-ov">
  <div class="dlg">
    <div class="dlg-t" id="dlg-t"></div>
    <div class="dlg-b" id="dlg-b"></div>
    <div class="dlg-f">
      <button class="btn btn-ghost" onclick="cDlg()" id="dlg-cancel">Cancel</button>
      <button class="btn btn-solid" id="dlg-ok">Confirm</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div id="mod-ov" onclick="if(event.target===this)cMod()">
  <div class="mod">
    <div class="mod-drag"></div>
    <div class="mod-t" id="mod-t"></div>
    <div id="mod-b"></div>
    <div class="mod-f" id="mod-f"></div>
  </div>
</div>

<!-- ══ LOGIN ══ -->
<div id="s-login" class="scr on">
  <div class="lw">
    <div class="lbrand">
      <div class="lmark"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      <span style="font-size:17px;font-weight:700;letter-spacing:-.4px">WorkSpace</span>
    </div>
    <div class="lcard">
      <div class="lh">Welcome back</div>
      <div class="ls">Select your profile to sign in</div>
      <div class="emp-list" id="elist"></div>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="s-app" class="scr">

  <!-- Mobile topbar -->
  <div class="mob-top">
    <button class="ham" id="ham-btn" onclick="togSB()"><span></span><span></span><span></span></button>
    <span class="mob-brand">WorkSpace</span>
    <div class="mob-av" id="mob-av"></div>
  </div>

  <div id="sb-overlay" onclick="cloSB()"></div>

  <!-- ── SIDEBAR ── -->
  <div class="sb" id="sidebar">
    <div class="sb-top">
      <div class="sb-brand">
        <div class="sb-mark"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
        <span class="sb-wname">WorkSpace</span>
      </div>
      <div class="sb-user">
        <div class="sb-av" id="sb-av"></div>
        <div class="sb-uinfo">
          <div class="sb-uname" id="sb-uname"></div>
          <div class="sb-urole" id="sb-urole"></div>
        </div>
      </div>
    </div>

    <!-- Work status pill -->
    <div class="wp"><div class="wp-row">
      <div class="wp-dot idle" id="wp-dot"></div>
      <span class="wp-lbl" id="wp-lbl">Not started</span>
      <span class="wp-tm" id="wp-tm"></span>
    </div></div>

    <!-- Attendance chip -->
    <div class="att-chip" onclick="nav('attendance',document.querySelector('[data-v=attendance]'))">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <div class="att-cdot" id="att-dot" style="background:var(--t4)"></div>
      <span style="font-size:12px;font-weight:600;flex:1" id="att-hrs">Today: —</span>
      <span style="font-size:11px;color:var(--blue);font-weight:500">Details</span>
    </div>

    <!-- Break button -->
    <button id="brk-btn" onclick="oBrk()">
      <svg viewBox="0 0 24 24"><path d="M17 8h1a4 4 0 0 1 0 8h-1M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V8zM6 1v3M10 1v3M14 1v3"/></svg>
      Take a Break
    </button>

    <nav class="sb-nav">
      <div class="ni on" data-v="dashboard" onclick="nav('dashboard',this)">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </div>
      <div class="ni" data-v="projects" onclick="nav('projects',this)">
        <svg viewBox="0 0 24 24"><rect x="2" y="3" width="6" height="5" rx="1"/><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="16" y="3" width="6" height="5" rx="1"/><rect x="2" y="11" width="6" height="5" rx="1"/><rect x="9" y="11" width="6" height="5" rx="1"/><rect x="16" y="11" width="6" height="5" rx="1"/></svg>
        Projects
      </div>
      <div class="ni" data-v="tracker" onclick="nav('tracker',this)">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        Task Tracker
        <div class="nbadge nb-red" id="nb-tr" style="display:none"></div>
      </div>
      <div class="ni" data-v="attendance" onclick="nav('attendance',this)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Attendance
      </div>
      <div class="ni" data-v="leave" onclick="nav('leave',this)">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><path d="M9 16l2 2 4-4"/></svg>
        Leave
        <div class="nbadge nb-red" id="nb-lv" style="display:none"></div>
      </div>
      <div class="ni" data-v="performance" onclick="nav('performance',this)">
        <svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
        Performance
      </div>
      <div class="ni" data-v="notifs" onclick="nav('notifs',this)">
        <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        Notifications
        <div class="nbadge nb-red" id="nb-no" style="display:none"></div>
      </div>
    </nav>

    <div class="sb-bot">
      <div class="sb-bot-av" id="sb-bot-av"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" id="sb-bot-name"></div>
      </div>
      <button class="sb-logout" style="margin-bottom:8px" onclick="connectEmployeeGoogleCalendar()">
        <span style="display:inline-flex;align-items:center;gap:8px">
          <span style="font-size:15px">G</span> Connect Google Calendar
        </span>
      </button>
      <button class="sb-logout" onclick="doLogout()">
        <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </div>

  <!-- ── MAIN ── -->
  <div class="main">
    <div class="content">

      <!-- DASHBOARD -->
      <div class="view on" id="v-dashboard"><div id="dash"></div></div>

      <!-- PROJECTS -->
      <div class="view" id="v-projects">
        <div class="shd"><div><div class="stitle">Projects</div><div class="ssub">View-only · admin managed</div></div></div>
        <div id="proj-list"></div>
      </div>

      <!-- PROJECT DETAIL -->
      <div class="view view-np" id="v-proj-detail"><div id="proj-det"></div></div>

      <!-- TASK TRACKER -->
      <div class="view" id="v-tracker">
        <div class="shd" style="margin-bottom:12px">
          <div><div class="stitle">Task Tracker</div><div class="ssub" id="tr-sub"></div></div>
          <button class="btn btn-purple btn-sm" onclick="oSA(null)">
            <svg viewBox="0 0 24 24" width="13" height="13"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Self Assign
          </button>
        </div>
        <div id="tr-filter"></div>
        <div id="tr-list"></div>
      </div>

      <!-- TASK DETAIL -->
      <div class="view view-np" id="v-detail"><div id="det-body"></div></div>

      <!-- ATTENDANCE -->
      <div class="view" id="v-attendance"><div id="att-body"></div></div>

      <!-- LEAVE -->
      <div class="view" id="v-leave"><div id="leave-body"></div></div>

      <!-- PERFORMANCE -->
      <div class="view" id="v-performance"><div id="perf-body"></div></div>

      <!-- NOTIFS -->
      <div class="view" id="v-notifs">
        <div class="shd"><div class="stitle">Notifications</div><button class="btn btn-ghost btn-sm" onclick="markRead()">Mark all read</button></div>
        <div id="notif-list"></div>
      </div>

    </div>
  </div>
</div>

<!-- Mobile bottom nav -->
<nav id="bnav">
  <button class="bni on" data-v="dashboard" onclick="nav('dashboard',document.querySelector('[data-v=dashboard]'));setBN(this)">
    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Home
  </button>
  <button class="bni" data-v="projects" onclick="nav('projects',document.querySelector('[data-v=projects]'));setBN(this)">
    <svg viewBox="0 0 24 24"><rect x="2" y="3" width="6" height="5" rx="1"/><rect x="9" y="3" width="6" height="5" rx="1"/><rect x="16" y="3" width="6" height="5" rx="1"/><rect x="2" y="11" width="6" height="5" rx="1"/><rect x="9" y="11" width="6" height="5" rx="1"/><rect x="16" y="11" width="6" height="5" rx="1"/></svg>Projects
  </button>
  <button class="bni" data-v="tracker" onclick="nav('tracker',document.querySelector('[data-v=tracker]'));setBN(this)">
    <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Tasks
    <div class="bni-badge" id="bni-tr" style="display:none"></div>
  </button>
  <button class="bni" data-v="attendance" onclick="nav('attendance',document.querySelector('[data-v=attendance]'));setBN(this)">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>Hours
  </button>
  <button class="bni" data-v="notifs" onclick="nav('notifs',document.querySelector('[data-v=notifs]'));setBN(this)">
    <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>Alerts
    <div class="bni-badge" id="bni-no" style="display:none"></div>
  </button>
</nav>

<!-- JavaScript — load in dependency order -->
<!-- Shared layer — dono apps ka ek data model -->
<script src="../shared/icons.js"></script>
<script src="../shared/schema.js"></script>
<script src="../shared/utils.js"></script>
<script src="../shared/seed.js"></script>
<script src="../shared/api-config.js"></script>
<script src="../shared/data.js"></script>
<script src="../shared/hrm.js"></script>
<script src="../shared/glossary.js"></script>

<script src="js/state.js"></script>
<script src="js/utils.js"></script>
<script src="js/components/modal.js"></script>
<script src="js/components/sidebar.js"></script>
<script src="js/components/header.js"></script>
<script src="js/services/sync.js"></script>
<script src="js/modules/dashboard.js"></script>
<script src="js/modules/tasks.js"></script>
<script src="js/modules/projects.js"></script>
<script src="js/modules/performance.js"></script>
<script src="js/modules/attendance.js"></script>
<script src="js/modules/tasks_tracker.js"></script>
<script src="js/modules/leave.js"></script>
<script src="js/modules/notifications.js"></script>
<script src="js/app.js"></script>

</body>
</html>
